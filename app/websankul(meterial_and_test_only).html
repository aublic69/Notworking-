            if (dd && dd.classList.contains("show") && ui && !ui.contains(e.target)) dd.classList.remove("show");
        });
        function toggleProfileDropdown() {
            document.getElementById("profile-dropdown").classList.toggle("show");
        }

        // ─── AUTH ─────────────────────────────────────────────────────────────
        function switchAuthPanel(panelId) {
            document.querySelectorAll(".auth-panel").forEach((p) => p.classList.remove("active"));
            document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
            document.getElementById(panelId).classList.add("active");
            document.querySelector(`[data-panel="${panelId}"]`).classList.add("active");
        }
        function sendOTP() {
            const phone = document.getElementById("phone-input").value.trim();
            if (phone.length !== 10 || !/^\d{10}$/.test(phone)) {
                toast("Please enter a valid 10-digit number", "warning"); return;
            }
            const btn = document.getElementById("send-otp-btn");
            btn.disabled = true; btn.innerHTML = `⏳ Sending...`;
            fetch(`${BASE}/otp/generate`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phoneNumber: phone, countryCode: "+91" }),
            })
                .then((r) => r.json())
                .then((data) => {
                    if (data.Status === "Success" || data.statusCode === 200) {
                        STATE.otpDetails = data.Details || data.details;
                        document.getElementById("step-phone").style.display = "none";
                        document.getElementById("step-otp").style.display = "block";
                        document.getElementById("otp-phone-display").textContent = `+91 ${phone}`;
                        toast("OTP sent successfully!", "success");
                        document.getElementById("otp-inputs").children[0].focus();
                    } else toast("Failed: " + (data.message || "Error"), "error");
                })
                .catch((e) => toast("Error: " + e.message, "error"))
                .finally(() => { btn.disabled = false; btn.textContent = "📨 Send OTP"; });
        }
        function otpMove(el, idx) {
            el.value = el.value.replace(/\D/g, '');
            if (el.value.length >= 1 && idx < 3) document.getElementById("otp-inputs").children[idx + 1].focus();
            if (idx === 3) {
                let val = "";
                document.getElementById("otp-inputs").querySelectorAll("input").forEach((i) => (val += i.value));
                if (val.length === 4) setTimeout(() => verifyOTP(), 300);
            }
        }
        function verifyOTP() {
            let otp = "";
            document.getElementById("otp-inputs").querySelectorAll("input").forEach((i) => (otp += i.value));
            if (otp.length !== 4) { toast("Enter 4-digit OTP", "warning"); return; }
            const phone = document.getElementById("phone-input").value.trim();
            const btn = document.getElementById("verify-otp-btn");
            btn.disabled = true; btn.innerHTML = `⏳ Verifying...`;
            fetch(`${BASE}/otp/validate`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phoneNumber: phone, countryCode: "+91", otp, details: STATE.otpDetails || "" }),
            })
                .then((r) => r.json())
                .then((data) => {
                    if (data.accessToken || data.token) {
                        STATE.accessToken = data.accessToken || data.token;
                        STATE.user = data.user || { fullName: "User", phoneNumber: phone };
                        STATE.details = data;
                        localStorage.setItem("ws_token", STATE.accessToken);
                        localStorage.setItem("ws_user", JSON.stringify(STATE.user));
                        toast("✅ Login successful!", "success");
                        enterApp();
                    } else {
                        toast("❌ Invalid OTP", "error");
                        document.getElementById("otp-inputs").querySelectorAll("input").forEach((i) => (i.value = ""));
                        document.getElementById("otp-inputs").children[0].focus();
                    }
                })
                .catch((e) => toast("Error: " + e.message, "error"))
                .finally(() => { btn.disabled = false; btn.textContent = "✅ Verify & Login"; });
        }
        function resetOTP() {
            document.getElementById("step-phone").style.display = "block";
            document.getElementById("step-otp").style.display = "none";
            document.getElementById("otp-inputs").querySelectorAll("input").forEach((i) => (i.value = ""));
        }
        function loginWithToken() {
            const token = document.getElementById("token-input").value.trim();
            if (!token) { toast("❌ Please paste your token", "warning"); return; }
            let device = {};
            try {
                const d = document.getElementById("device-info-input").value.trim();
                if (d) device = JSON.parse(d);
            } catch (e) { toast("❌ Invalid JSON", "error"); return; }
            STATE.accessToken = token;
            STATE.deviceInfo = device;
            STATE.user = { fullName: "Token User", phoneNumber: "N/A" };
            localStorage.setItem("ws_token", token);
            localStorage.setItem("ws_device", JSON.stringify(device));
            toast("✅ Token set!", "success");
            enterApp();
        }
        function logout() {
            STATE.accessToken = null; STATE.user = null; STATE.lastBookData = null;
            localStorage.removeItem("ws_token");
            localStorage.removeItem("ws_user");
            localStorage.removeItem("ws_device");
            document.getElementById("app-shell").classList.remove("active");
            document.getElementById("auth-screen").style.display = "flex";
            document.getElementById("profile-dropdown").classList.remove("show");
            resetOTP();
            toast("Logged out", "info");
        }
        function enterApp() {
            document.getElementById("auth-screen").style.display = "none";
            document.getElementById("app-shell").classList.add("active");
            const u = STATE.user || {};
            const name = u.fullName || "User";
            const initial = name.charAt(0).toUpperCase();
            ["user-avatar", "pd-avatar"].forEach((id) => (document.getElementById(id).textContent = initial));
            document.getElementById("user-name").textContent = name;
            document.getElementById("pd-name").textContent = name;
            document.getElementById("pd-phone").textContent = `+91 ${u.phoneNumber || "**********"}`;
            showDashboard();
        }
        function switchView(view) {
            STATE.currentView = view;
            document.querySelectorAll(".app-nav-item").forEach((i) => i.classList.toggle("active", i.dataset.view === view));
            document.getElementById("profile-dropdown").classList.remove("show");

        function renderPackageCard(pkg) {

        async function openEbookDirect(ebookId) {
            // Dashboard cache mein check karo pehle
            let eb = (STATE.ebookSectionData || []).find((e) => e.id === ebookId);

            // Agar cache mein nahi mila toh API se fetch karo
            if (!eb) {
                toast("📘 Loading ebook...", "info");
                try {
                    const r = await fetch(`${EBOOK_URL}/${ebookId}`, {
                        headers: {
                            authorization: `bearer ${STATE.accessToken}`,
                            deviceinfo: JSON.stringify(STATE.deviceInfo || {}),
                            Accept: "application/json",
                        },
                    });
                    const data = await r.json();
                    eb = data.ebook || data;
                } catch (e) {
                    toast("❌ Failed to load: " + e.message, "error");
                    return;
                }
            }

            if (!eb) { toast("❌ Ebook not found", "error"); return; }

            const salt = eb.salt;
            const encUrl = eb.bookUrl;
            const encDemo = eb.bookDemoUrl;
            const thumb = eb.thumbnail
                ? `https://www.gpsconline.com/uploads/e-books/thumbnail/${eb.thumbnail}`
                : (eb.image ? `https://www.gpsconline.com/uploads/e-books/thumbnail/${eb.image}` : "");

            // Try bookUrl first, fallback to bookDemoUrl
            let pdfUrl = null;
            if (encUrl && salt) {
                pdfUrl = aesDecrypt(encUrl, salt);
            }
            if (!pdfUrl && encDemo && salt) {
                pdfUrl = aesDecrypt(encDemo, salt);
            }

            showEbookModal(eb.name || "EBook", eb.author || "", eb.language || "", thumb, pdfUrl, eb);
        }

        function toggleEbookFullscreen() {

        function closeEbookModal() {

        async function downloadEbookPDF(title) {
            const url = document.getElementById("ebook-modal")?.dataset?.pdfUrl;
            if (!url) { toast("No URL", "warning"); return; }
            toast("⏳ Downloading...", "info");
            try {
                const r = await fetch(url);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const blob = await r.blob();
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = (title || "ebook") + ".pdf";
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                toast("✅ Downloaded!", "success");
            } catch (e) {
                toast("❌ " + e.message + " — Opening in tab", "error");
                window.open(url, "_blank");
            }

        function decryptField(field) {

            document.getElementById("manualEncrypted").value = enc;
            document.getElementById("manualSalt").value = salt;
            manualDecrypt();

        function manualDecrypt() {
            const enc = document.getElementById("manualEncrypted").value.trim();
            const pass = document.getElementById("manualSalt").value.trim();

            const result = aesDecrypt(enc, pass);
            const box = document.getElementById("decryptBox");

    } else {

}

async function downloadFromViewer() {
    const modal = document.getElementById("pdf-viewer-modal");
    const url = modal?.dataset?.pdfUrl;
    const title = modal?.dataset?.title || "document";
    if (!url) return;
    toast("⏳ Downloading...", "info");
    try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const blob = await r.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = title + ".pdf";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        toast("✅ Downloaded!", "success");
    } catch (e) {
        toast("❌ " + e.message + " — opening in tab", "error");
        window.open(url, "_blank");
    }
}
        function aesDecrypt(enc, pass) {
            try {
                const b = CryptoJS.AES.decrypt(enc, pass);
                return b.toString(CryptoJS.enc.Utf8) || null;
            } catch (e) { return null; }
        }
        function copyDecrypted() {

                const blob = await r.blob();
                const name = (STATE.lastBookData?.ebook?.name || "book") + ".pdf";
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = name;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
                setBookStatus("success", "✅ Downloaded: " + name);
            } catch (e) {
                setBookStatus("error", "❌ " + e.message);

            const container = document.getElementById("app-content");
            container.innerHTML = `
            <div class="back-bar"><button onclick="exitExam()">←</button><h2>${STATE.currentExamData?.name || "Exam"}</h2></div>
            <div class="question-header">
                <div class="q-progress" id="qProgress">Question 1 of ${questions.length}</div>
                <div style="display:flex;align-items:center;gap:12px">
                    <span style="font-size:12px;font-weight:700;background:var(--primary-light);color:var(--primary);padding:4px 12px;border-radius:20px">📝 ${questions.length} Q</span>
                    <div class="q-timer" id="qTimer">${formatTime(totalTime)}</div>
                </div>
            </div>
            <div id="questionArea"></div>
            <div class="question-actions" style="margin-top:20px">
                <button class="btn btn-outline" onclick="prevQuestion()">← Previous</button>
                <button class="btn btn-outline" onclick="nextQuestion()">Next →</button>
            </div>
            <div style="margin-top:20px"><button class="btn btn-submit" onclick="submitExam()">📤 Submit Exam</button></div>`;
            renderQuestion(0);
            startExamTimer(totalTime);
        }

        function renderQuestion(index) {
            const questions = STATE.currentExamQuestions;
            if (!questions || index < 0 || index >= questions.length) return;
            currentQuestionIndex = index;
            const q = questions[index];
            const area = document.getElementById("questionArea");
            const answers = q.answers || [];
            const selectedId = STATE.examAnswers[q.id] || null;
            const isSkipped = selectedId === "skip";

            let optionsHtml = "";
            answers.forEach((a) => {
                if (a.name === "Skip" || a.name === "skip") return;
                const isSelected = selectedId === a.id;
                optionsHtml += `
                    <div class="option-item ${isSelected ? "selected" : ""}" onclick="selectOption(${q.id}, ${a.id})">
                        <div class="option-radio"></div>
                        <div class="option-text">${a.name}</div>
                    </div>`;
            });
            optionsHtml += `
                <div class="option-item ${isSkipped ? "selected" : ""}" onclick="selectOption(${q.id}, 'skip')" style="opacity:0.7">
                    <div class="option-radio"></div>
                    <div class="option-text"><span class="skip-label">⏭️ Skip this question</span></div>
                </div>`;

            area.innerHTML = `
                <div class="question-card">
                    <div class="q-number">${index + 1}</div>
                    <div class="q-text">${q.name || "Question"}</div>
                    ${q.image ? `<div style="margin-bottom:14px"><img src="${q.image}" style="max-width:100%;border-radius:var(--radius)" alt="question image"></div>` : ""}
                    <div class="options-grid">${optionsHtml}</div>
                </div>`;

            document.getElementById("qProgress").textContent = `Question ${index + 1} of ${questions.length}`;
        }

        function selectOption(questionId, answerId) {
            STATE.examAnswers[questionId] = answerId;
            renderQuestion(currentQuestionIndex);
        }

        function nextQuestion() {
            const questions = STATE.currentExamQuestions;
            if (currentQuestionIndex < questions.length - 1) renderQuestion(currentQuestionIndex + 1);
        }
        function prevQuestion() {
            if (currentQuestionIndex > 0) renderQuestion(currentQuestionIndex - 1);
        }

        let examTimerInterval = null;
        function startExamTimer(seconds) {
            if (examTimerInterval) clearInterval(examTimerInterval);
            const timerEl = document.getElementById("qTimer");
            if (!timerEl) return;
            let remaining = seconds;
            examTimerInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(examTimerInterval);
                    toast("⏰ Time is up! Auto-submitting...", "warning");
                    submitExam();
                    return;
                }
                if (timerEl) {
                    timerEl.textContent = formatTime(remaining);
                    timerEl.classList.toggle("warning", remaining < 60);
                }
            }, 1000);
        }
        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
        }
        function exitExam() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            if (Object.keys(STATE.examAnswers).length > 0) {
                if (!confirm("Exit exam? Your answers will be lost.")) return;
            }
            STATE.currentExamId = null; STATE.currentExamQuestions = null;
            STATE.examAnswers = {}; STATE.examResult = null;
            if (STATE.currentPackageId) openPackage(STATE.currentPackageId);
            else showExams();
        }

        function submitExam() {
            const questions = STATE.currentExamQuestions;
            if (!questions || !questions.length) return;
            let answered = 0, skipped = 0;
            questions.forEach((q) => {
                const ans = STATE.examAnswers[q.id];
                if (!ans || ans === "skip") skipped++;
                else answered++;
            });
            if (answered === 0) {
                if (!confirm("You haven't answered any questions. Submit anyway?")) return;
            } else {
                if (!confirm(`Submit exam?
Answered: ${answered}
Skipped: ${skipped}
Total: ${questions.length}`)) return;
            }
            if (examTimerInterval) clearInterval(examTimerInterval);
            const posMarks = STATE.currentExamData?.positiveMarks || 1;
            const negMarks = STATE.currentExamData?.negativeMarks || 0;
            let correct = 0, wrong = 0, skip = 0;
            questions.forEach((q) => {
                const selectedAns = STATE.examAnswers[q.id];
                if (!selectedAns || selectedAns === "skip") { skip++; }
                else {
                    const correctObj = (q.answers || []).find((a) => a.answer === true);
                    if (correctObj && selectedAns === correctObj.id) correct++;
                    else wrong++;
                }
            });
            const score = correct * posMarks - wrong * negMarks;
            const attempt = correct + wrong;
            const timeTaken = Math.round((Date.now() - STATE.examStartTime) / 1000);
            const accuracy = attempt > 0 ? ((correct / attempt) * 100).toFixed(1) : "0.0";
            const mins = Math.floor(timeTaken / 60);
            const secs = timeTaken % 60;
            const localResult = {
                score: score, total: questions.length, attempt: attempt,
                success: correct, failed: wrong, skip: skip,
                accuracy: accuracy, timing: `${mins}m ${secs}s`, rank: "N/A",
            };
            STATE.examResult = { examResult: localResult };
            renderExamResult({ examResult: localResult });
        }

        function renderExamResult(data) {
            const result = data.examResult || data;
            const container = document.getElementById("app-content");
            const accuracy = result.accuracy !== undefined ? parseFloat(result.accuracy).toFixed(1) : "N/A";
            container.innerHTML = `
            <div class="back-bar"><button onclick="exitExam()">←</button><h2>📊 Exam Result</h2></div>
            <div class="result-card">
                <div style="margin-bottom:20px">
                    <div style="font-size:14px;color:var(--text-muted);margin-bottom:6px">Your Score</div>
                    <div class="result-score">${result.score || 0}</div>
                </div>
                <div class="result-detail">
                    <div class="result-item"><div class="rlabel">Total Questions</div><div class="rvalue">${result.total || 0}</div></div>
                    <div class="result-item"><div class="rlabel">Attempted</div><div class="rvalue">${result.attempt || 0}</div></div>
                    <div class="result-item"><div class="rlabel">Correct</div><div class="rvalue green">${result.success || 0}</div></div>
                    <div class="result-item"><div class="rlabel">Wrong</div><div class="rvalue red">${result.failed || 0}</div></div>
                    <div class="result-item"><div class="rlabel">Skipped</div><div class="rvalue orange">${result.skip || 0}</div></div>
                    <div class="result-item"><div class="rlabel">Accuracy</div><div class="rvalue green">${accuracy}%</div></div>
                    <div class="result-item"><div class="rlabel">Time Taken</div><div class="rvalue" style="font-size:14px">${result.timing || "N/A"}</div></div>
                    <div class="result-item"><div class="rlabel">Rank</div><div class="rvalue" style="font-size:14px;color:var(--primary)">${result.rank || "N/A"}</div></div>
                </div>
                <div style="margin-top:24px;display:flex;gap:12px">
                    <button class="btn btn-primary" style="flex:1" onclick="exitExam()">📝 Back</button>
                    <button class="btn btn-outline" style="flex:1" onclick="reviewExamAnswers()">🔍 Review</button>
                </div>
            </div>`;
        }

        function reviewExamAnswers() {
            const questions = STATE.currentExamQuestions;
            if (!questions || !questions.length) { toast("No questions data available", "warning"); return; }
            const container = document.getElementById("app-content");
            let html = `<div class="back-bar"><button onclick="renderExamResult(STATE.examResult)">←</button><h2>🔍 Answer Review</h2></div>`;
            questions.forEach((q, i) => {
                const selectedAns = STATE.examAnswers[q.id];
                const answers = q.answers || [];
                const correctAnswerObj = answers.find((a) => a.answer === true);
                const correctId = correctAnswerObj ? correctAnswerObj.id : null;
                const isCorrect = selectedAns === correctId;
                const isSkipped = !selectedAns || selectedAns === "skip";
                let statusIcon = "⏭️";
                if (selectedAns && selectedAns !== "skip") statusIcon = isCorrect ? "✅" : "❌";
                html += `
                    <div class="question-card" style="border-left:4px solid ${isSkipped ? "var(--warning)" : isCorrect ? "var(--success)" : "var(--danger)"};margin-bottom:14px">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                            <div class="q-number" style="margin-bottom:0">${i + 1}</div>
                            <span style="font-size:20px">${statusIcon}</span>
                        </div>
                        <div class="q-text" style="font-size:15px">${q.name || "Question"}</div>
                        ${q.image ? `<div style="margin-bottom:12px"><img src="${q.image}" style="max-width:100%;border-radius:var(--radius);max-height:200px" alt="question image"></div>` : ""}
                        <div class="options-grid" style="gap:6px">`;
                answers.forEach((a) => {
                    if (a.name === "Skip" || a.name === "skip") return;
                    const isSelected = selectedAns === a.id;
                    const isRightAnswer = a.answer === true;
                    let cls = "";
                    if (isRightAnswer) cls = "correct";
                    else if (isSelected && !isRightAnswer) cls = "wrong";
                    html += `<div class="option-item ${cls}" style="cursor:default;padding:12px 14px">
                        <div class="option-radio">${isRightAnswer ? "✓" : ""}</div>
                        <div class="option-text" style="font-size:13px">${a.name} ${isRightAnswer ? '<span style="color:var(--success);font-weight:700;margin-left:8px">(Correct)</span>' : ""}</div>
                    </div>`;
                });
                if (isSkipped) html += `<div style="margin-top:8px;padding:8px 12px;background:var(--warning-light);border-radius:var(--radius);font-size:13px;color:var(--warning);font-weight:500">⏭️ You skipped this question</div>`;
                if (!isCorrect && selectedAns && selectedAns !== "skip") {
                    html += `<div style="margin-top:8px;padding:8px 12px;background:var(--success-light);border-radius:var(--radius);font-size:13px;color:var(--success);font-weight:500">✅ Correct answer: ${q.answer || "See above"}</div>`;
                    if (q.solutionDescription && q.solutionDescription !== ".") {
                        html += `<div style="margin-top:6px;padding:8px 12px;background:var(--primary-light);border-radius:var(--radius);font-size:13px;color:var(--primary);font-weight:500">💡 ${q.solutionDescription}</div>`;
                    }
                }
                html += `</div></div>`;
            });
            html += `<div style="margin-top:20px;text-align:center;padding-bottom:40px"><button class="btn btn-primary" onclick="renderExamResult(STATE.examResult)">📊 Back to Result</button></div>`;
            container.innerHTML = html;
        }

        // ═══ INIT ═══════════════════════════════════════════════
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("ws_token");
            if (token) {
                STATE.accessToken = token;
                try {
                    const u = localStorage.getItem("ws_user");
                    if (u) STATE.user = JSON.parse(u);
                    const d = localStorage.getItem("ws_device");
                    if (d) STATE.deviceInfo = JSON.parse(d);
                } catch (e) { }
                if (STATE.user) {
                    document.getElementById("auth-screen").style.display = "none";
                    enterApp();
                    hideLoading();
                    return;
                }
            }
            hideLoading();
        });
        setTimeout(hideLoading, 2000);
    </script>
</body>

</html>
