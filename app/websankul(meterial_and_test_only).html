<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>WebSankul Pro — Enterprise Learning Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: rgba(99, 102, 241, 0.15);
            --primary-dark: #4338ca;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #7c3aed 50%, #2563eb 100%);
            --accent: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);

            /* DARK THEME (DEFAULT) */
            --bg: #090d16;
            --surface: #131b2e;
            --surface-elevated: #1e293b;
            --text: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #232f48;
            --border-light: #1b2438;

            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.15);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.15);
            --info: #3b82f6;
            --info-light: rgba(59, 130, 246, 0.15);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
            --shadow-primary: 0 10px 40px -10px rgba(99, 102, 241, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* LIGHT THEME OVERRIDE */
        :root:has(body.light-theme),
        body.light-theme {
            --bg: #f8fafc !important;
            --surface: #ffffff !important;
            --surface-elevated: #ffffff !important;
            --text: #0f172a !important;
            --text-secondary: #334155 !important;
            --text-muted: #64748b !important;
            --border: #e2e8f0 !important;
            --border-light: #f1f5f9 !important;
            --primary-light: #eef2ff !important;
            --success-light: #d1fae5 !important;
            --danger-light: #fee2e2 !important;
            --warning-light: #fef3c7 !important;
            --info-light: #dbeafe !important;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1) !important;
        }

        body.light-theme {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }

        body.light-theme .app-header,
        body.light-theme .app-nav {
            background: #ffffff !important;
            border-bottom-color: #e2e8f0 !important;
        }

        body.light-theme .card,
        body.light-theme .package-card,
        body.light-theme .subject-card,
        body.light-theme .lecture-item,
        body.light-theme .search-bar,
        body.light-theme .exam-card,
        body.light-theme .modal-content,
        body.light-theme .profile-hero,
        body.light-theme .profile-info-grid,
        body.light-theme .info-item {
            background: #ffffff !important;
            border-color: #e2e8f0 !important;
            color: #0f172a !important;
        }

        body.light-theme input,
        body.light-theme textarea {
            background: #f8fafc !important;
            color: #0f172a !important;
            border-color: #cbd5e1 !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ═══ LOADING SCREEN ═══ */
        #app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0f9ff 100%);
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #app-loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 3px solid var(--primary-light);
            border-top-color: var(--primary);
            border-right-color: var(--primary-dark);
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .loader-brand {
            font-size: 28px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ═══ TOAST ═══ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: #1e293b;
            color: #f8fafc;
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: var(--transition);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .toast-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ═══ SCROLL TOP ═══ */
        #scroll-top {
            position: fixed;
            right: 20px;
            bottom: 90px;
            display: none;
            background: var(--surface);
            color: var(--primary);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-lg);
            cursor: pointer;
            z-index: 100;
            font-size: 18px;
            font-weight: 700;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            align-items: center;
            justify-content: center;
        }

        #scroll-top.show {
            display: flex;
        }

        #scroll-top:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* ═══ AUTH SCREEN ═══ */
        #auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 25%, #fdf4ff 50%, #fff7ed 75%, #f8fafc 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .auth-card {
            background: var(--surface);
            width: 460px;
            max-width: 100%;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .logo {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius);
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            box-shadow: var(--shadow-primary);
        }

        .logo-text h2 {
            font-size: 26px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sub {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.6;
        }

        .auth-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            background: var(--bg);
            padding: 4px;
            border-radius: var(--radius);
        }

        .auth-tab {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
            font-family: inherit;
            position: relative;
        }

        .auth-tab.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .auth-tab:hover:not(.active) {
            color: var(--text-secondary);
        }

        .auth-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .auth-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="tel"],
        input[type="text"],
        input[type="number"],
        textarea,
        .otp-inputs input {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            transition: var(--transition);
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 1.6;
        }

        .btn {
            padding: 12px 20px;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 100%);
            pointer-events: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: var(--shadow-primary);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 14px 40px -10px rgba(79, 70, 229, 0.5);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .otp-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }

        .otp-inputs input {
            width: 56px;
            height: 56px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border-radius: var(--radius);
            padding: 0;
            background: var(--bg);
        }

        .otp-inputs input:focus {
            background: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* ═══ APP SHELL ═══ */
        #app-shell {
            display: none;
        }

        #app-shell.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 200;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            gap: 10px;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            box-shadow: var(--shadow-primary);
        }

        .brand span {
            font-weight: 700;
            font-size: 18px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .dev-setting-btn {
            margin-left: auto;
            margin-right: 8px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .dev-setting-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .exit-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 12px;
            transition: background 0.2s ease;
        }

        .exit-btn:hover {
            background: #dc2626;
        }

        .user-info {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            border-radius: var(--radius-lg);
            transition: var(--transition);
        }

        .user-info:hover {
            background: var(--bg);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .name::after {
            content: '▼';
            font-size: 8px;
            margin-left: 6px;
            color: var(--text-muted);
        }

        .profile-dropdown {
            position: absolute;
            right: 0;
            top: 52px;
            background: var(--surface);
            width: 260px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            z-index: 300;
            animation: dropdownIn 0.2s ease;
        }

        .profile-dropdown.show {
            display: flex;
        }

        @keyframes dropdownIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .pd-header {
            padding: 16px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pd-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .pd-header h4 {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
        }

        .pd-header p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        .pd-divider {
            height: 1px;
            background: var(--border);
        }

        .pd-item {
            padding: 12px 16px;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            color: var(--text);
            transition: var(--transition);
            font-family: inherit;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pd-item:hover {
            background: var(--bg);
        }

        .pd-item.danger {
            color: var(--danger);
        }

        .pd-item.danger:hover {
            background: var(--danger-light);
        }

        .pd-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* ═══ FIXED BOTTOM NAVIGATION ═══ */
        .app-nav {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding: 0 16px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.1);
        }

        body.light-theme .app-nav {
            background: #ffffff !important;
            border-top-color: #e2e8f0 !important;
        }

        .app-nav::-webkit-scrollbar {
            display: none;
        }

        .app-nav-item {
            flex: 1;
            max-width: 120px;
            height: 46px;
            border-radius: var(--radius);
            border: none;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--text-muted);
            font-family: inherit;
        }

        .app-nav-item .nav-icon {
            font-size: 18px;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .app-nav-item .nav-text {
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
        }

        .app-nav-item.active {
            background: var(--primary-light);
            color: var(--primary) !important;
        }

        .app-nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        .app-nav-item:hover:not(.active) {
            background: var(--surface-hover);
            color: var(--primary);
        }

        /* ═══ CONTENT ═══ */
        .app-content {
            padding: 28px;
            padding-bottom: 80px !important;
            max-width: 1200px;
            margin: 0 auto;
            min-height: calc(100vh - 140px);
        }

            .section {
                margin-bottom: 32px;
            }

            .section-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }

            .section-header h2 {
                font-size: 20px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .section-header a {
                color: var(--primary);
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: 4px;
                padding: 6px 12px;
                border-radius: var(--radius-sm);
                transition: var(--transition);
            }

            .section-header a:hover {
                background: var(--primary-light);
                text-decoration: none;
            }

            /* ═══ BANNER CAROUSEL ═══ */
            .banner-carousel {
                position: relative;
                overflow: hidden;
                border-radius: var(--radius-xl);
                margin-bottom: 32px;
                background: var(--primary-light);
                max-height: 240px;
                box-shadow: var(--shadow-md);
            }

            .slides {
                display: flex;
                transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
                height: 220px;
            }

            .slide {
                min-width: 100%;
                overflow: hidden;
                position: relative;
            }

            .slide img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .slide-overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(90deg, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.2) 60%, transparent 100%);
                display: flex;
                align-items: center;
                padding: 0 40px;
            }

            .slide-content h3 {
                color: #fff;
                font-size: 24px;
                font-weight: 800;
                margin-bottom: 8px;
                text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            }

            .slide-content p {
                color: rgba(255, 255, 255, 0.85);
                font-size: 14px;
                max-width: 400px;
                line-height: 1.6;
            }

            .dots {
                position: absolute;
                bottom: 16px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
            }

            .dots span {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.4);
                cursor: pointer;
                transition: var(--transition);
            }

            .dots span.active {
                background: #fff;
                width: 24px;
                border-radius: 4px;
            }

            /* ═══ CARDS & THUMBNAILS FIX ═══ */
            .package-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }

            .package-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                overflow: hidden;
                cursor: pointer;
                transition: var(--transition);
                position: relative;
                display: flex;
                flex-direction: column;
            }

            .package-card::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-lg);
                opacity: 0;
                transition: opacity 0.3s ease;
                pointer-events: none;
            }

            .package-card:hover {
                transform: translateY(-6px);
                border-color: var(--primary);
            }

            .package-card:hover::after {
                opacity: 1;
            }

            .pimg {
                position: relative;
                width: 100%;
                aspect-ratio: 16 / 9;
                height: auto;
                background: linear-gradient(135deg, #0f172a, #1e293b);
                overflow: hidden;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .pimg img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
                transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .package-card:hover .pimg img {
                transform: scale(1.05);
            }

            /* Ebook portrait thumbnail fix */
            .pimg.ebook-thumb-wrap {
                height: 210px;
                aspect-ratio: auto;
                background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
                padding: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            .pimg.ebook-thumb-wrap img.ebook-thumb-img {
                max-height: 100%;
                max-width: 100%;
                width: auto;
                height: 100%;
                object-fit: contain;
                border-radius: 6px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            }

            .img-fallback {
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 40px;
                width: 100%;
                height: 100%;
                color: var(--text-muted);
                background: rgba(255, 255, 255, 0.03);
            }

            .ptype {
                position: absolute;
                top: 12px;
                left: 12px;
                z-index: 2;
                font-size: 11px;
                font-weight: 700;
                color: var(--primary);
                background: rgba(255, 255, 255, 0.95);
                padding: 4px 10px;
                border-radius: 20px;
                backdrop-filter: blur(8px);
                box-shadow: var(--shadow-sm);
            }

            .pbody {
                padding: 18px;
            }

            .pbody h3 {
                font-size: 16px;
                font-weight: 700;
                margin-bottom: 8px;
                line-height: 1.4;
                color: var(--text);
            }

            .pdesc {
                font-size: 13px;
                color: var(--text-muted);
                line-height: 1.6;
                margin-bottom: 14px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .pmeta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-top: 12px;
                border-top: 1px solid var(--border-light);
            }

            .price {
                font-size: 16px;
                font-weight: 800;
                background: var(--primary-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .price small {
                font-size: 12px;
                font-weight: 500;
                color: var(--text-muted);
                -webkit-text-fill-color: var(--text-muted);
            }

            .subs {
                font-size: 12px;
                color: var(--text-muted);
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 4px;
            }

            /* ═══ SUBJECT CARDS ═══ */
            .subject-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 16px;
            }

            .subject-card {
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 20px;
                cursor: pointer;
                text-align: center;
                transition: var(--transition);
                position: relative;
            }

            .subject-card:hover {
                transform: translateY(-4px);
                border-color: var(--primary);
                box-shadow: var(--shadow-md);
            }

            .simg {
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 14px;
                overflow: hidden;
                border-radius: var(--radius);
                background: var(--primary-light);
            }

            .simg img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: var(--radius);
            }

            .subject-card h4 {
                font-size: 14px;
                font-weight: 700;
                margin-bottom: 6px;
                line-height: 1.3;
                color: var(--text);
            }

            .subject-card p {
                font-size: 12px;
                color: var(--text-muted);
                font-weight: 500;
            }

            .new-badge {
                position: absolute;
                top: 10px;
                right: 10px;
                background: var(--success);
                color: #fff;
                font-size: 10px;
                font-weight: 700;
                padding: 3px 8px;
                border-radius: 20px;
                box-shadow: var(--shadow-sm);
            }

            /* ═══ LECTURE LIST ═══ */
            .lecture-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .lecture-item {
                display: flex;
                align-items: center;
                gap: 14px;
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius);
                padding: 14px 16px;
                cursor: pointer;
                transition: var(--transition);
            }

            .lecture-item:hover {
                border-color: var(--primary);
                background: var(--primary-light);
                transform: translateX(4px);
            }

            .lnum {
                width: 36px;
                height: 36px;
                border-radius: var(--radius-sm);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 13px;
                flex-shrink: 0;
            }

            .lnum.free {
                background: var(--success-light);
                color: var(--success);
            }

            .lnum.paid {
                background: var(--danger-light);
                color: var(--danger);
            }

            .linfo {
                flex: 1;
                min-width: 0;
            }

            .ltitle {
                font-size: 14px;
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: var(--text);
            }

            .lmeta {
                font-size: 12px;
                color: var(--text-muted);
                margin-top: 3px;
                font-weight: 500;
            }

            .lbadge {
                font-size: 11px;
                font-weight: 700;
                padding: 4px 10px;
                border-radius: 20px;
                flex-shrink: 0;
            }

            .lbadge.free {
                background: var(--success-light);
                color: var(--success);
            }

            .lbadge.paid {
                background: var(--danger-light);
                color: var(--danger);
            }

            /* ═══ BACK BAR ═══ */
            .back-bar {
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 24px;
                padding: 12px 0;
                border-bottom: 1px solid var(--border-light);
            }

            .back-bar button {
                background: var(--primary-light);
                color: var(--primary);
                border: none;
                border-radius: var(--radius);
                padding: 8px 16px;
                height: 40px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 700;
                transition: var(--transition);
                font-family: inherit;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }

            .back-bar button:hover {
                background: var(--primary);
                color: #fff;
                transform: translateX(-2px);
            }

            .back-bar h2 {
                font-size: 20px;
                font-weight: 700;
            }

            /* ═══ SEARCH ═══ */
            .search-bar {
                display: flex;
                align-items: center;
                gap: 12px;
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 12px 16px;
                margin-bottom: 20px;
                transition: var(--transition);
            }

            .search-bar:focus-within {
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
            }

            .search-bar span {
                font-size: 18px;
                color: var(--text-muted);
            }

            .search-bar input {
                border: none;
                background: transparent;
                font-size: 14px;
                flex: 1;
                color: var(--text);
                outline: none;
                font-family: inherit;
                font-weight: 500;
            }

            .search-bar input::placeholder {
                color: var(--text-muted);
            }

            /* ═══ MODAL ═══ */
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.7);
                backdrop-filter: blur(8px);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                padding: 16px;
                animation: fadeIn 0.2s ease;
            }

            .modal-overlay.show {
                display: flex;
            }

            .modal-content {
                background: var(--surface);
                border-radius: var(--radius-xl);
                width: 100%;
                max-width: 720px;
                overflow: hidden;
                position: relative;
                box-shadow: var(--shadow-lg);
                animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            @keyframes modalIn {
                from {
                    opacity: 0;
                    transform: scale(0.95) translateY(20px);
                }

                to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }

            .modal-close {
                position: absolute;
                top: 14px;
                right: 14px;
                background: rgba(0, 0, 0, 0.5);
                color: #fff;
                border: none;
                border-radius: 50%;
                width: 36px;
                height: 36px;
                font-size: 16px;
                cursor: pointer;
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: var(--transition);
            }

            .modal-close:hover {
                background: var(--danger);
                transform: rotate(90deg);
            }

            .modal-video {
                background: #000;
                position: relative;
                min-height: 260px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .modal-video video {
                width: 100%;
                max-height: 450px;
            }

            .play-icon {
                font-size: 64px;
                color: rgba(255, 255, 255, 0.9);
                cursor: pointer;
                transition: var(--transition);
                filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            }

            .play-icon:hover {
                color: #fff;
                transform: scale(1.15);
            }

            .modal-body {
                padding: 20px;
            }

            .modal-body h3 {
                font-size: 18px;
                font-weight: 700;
                margin-bottom: 6px;
            }

            .modal-body p {
                font-size: 13px;
                color: var(--text-muted);
            }

            /* ═══ TOOL CARDS ═══ */
            .tool-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            @media (max-width: 768px) {
                .tool-container {
                    grid-template-columns: 1fr;
                }

                .package-grid {
                    grid-template-columns: 1fr;
                }

                .subject-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }

            /* ===== THEME TOGGLE & LIGHT MODE ===== */
            body.light-theme {
                --bg: #f8fafc;
                --surface: #ffffff;
                --surface-hover: #f1f5f9;
                --border: #e2e8f0;
                --border-light: #cbd5e1;
                --text: #0f172a;
                --text-secondary: #334155;
                --text-muted: #64748b;
            }

            .theme-toggle {
                background: var(--surface);
                border: 1px solid var(--border);
                color: var(--text-secondary);
                width: 36px;
                height: 36px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 18px;
                transition: all .25s;
                margin-left: 8px;
            }

            .theme-toggle:hover {
                border-color: var(--primary);
                color: var(--primary);
                transform: scale(1.1);
            }

            .card {
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 20px;
                margin-bottom: 20px;
                transition: var(--transition);
            }

            .card:hover {
                border-color: var(--primary);
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 16px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .card-header h3 {
                font-size: 16px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .badge {
                font-size: 11px;
                font-weight: 700;
                background: var(--primary-light);
                color: var(--primary);
                padding: 4px 10px;
                border-radius: 20px;
            }

            .input-group {
                display: flex;
                gap: 10px;
                align-items: center;
                margin-bottom: 12px;
            }

            .flex-1 {
                flex: 1;
            }

            .status {
                padding: 10px 14px;
                border-radius: var(--radius);
                font-size: 13px;
                font-weight: 500;
                margin-top: 10px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .status.success {
                background: var(--success-light);
                color: #065f46;
            }

            .status.error {
                background: var(--danger-light);
                color: #991b1b;
            }

            .status.loading {
                background: var(--info-light);
                color: #1e40af;
            }

            .book-info {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .info-item {
                background: var(--bg);
                border: 1px solid var(--border-light);
                border-radius: var(--radius);
                padding: 12px;
                font-size: 13px;
                word-break: break-all;
                transition: var(--transition);
            }

            .info-item:hover {
                border-color: var(--primary);
            }

            .info-item .label {
                font-size: 10px;
                font-weight: 700;
                color: var(--text-muted);
                margin-bottom: 4px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .info-item code {
                background: rgba(79, 70, 229, 0.08);
                color: var(--primary);
                padding: 2px 8px;
                border-radius: var(--radius-sm);
                font-size: 12px;
                font-weight: 600;
            }

            .action-bar {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .response-box {
                background: #0f172a;
                color: #e2e8f0;
                padding: 16px;
                border-radius: var(--radius);
                font-family: 'JetBrains Mono', 'Fira Code', monospace;
                font-size: 12px;
                line-height: 1.7;
                overflow: auto;
                max-height: 340px;
                white-space: pre-wrap;
                word-break: break-all;
                border: 1px solid #1e293b;
            }

            .response-box .key {
                color: #93c5fd;
            }

            .response-box .string {
                color: #86efac;
            }

            .response-box .number {
                color: #fde68a;
            }

            .response-box .boolean {
                color: #f9a8d4;
            }

            .response-box .null {
                color: #94a3b8;
            }

            .response-box .bracket {
                color: #e2e8f0;
            }

            .decrypt-output {
                background: var(--success-light);
                border: 1.5px solid #bbf7d0;
                border-radius: var(--radius);
                padding: 16px;
                min-height: 80px;
                font-size: 13px;
                word-break: break-all;
            }

            .decrypted-url {
                margin-top: 12px;
                padding: 12px;
                background: var(--bg);
                border-radius: var(--radius);
                font-size: 12px;
                font-family: 'JetBrains Mono', monospace;
                border: 1px solid var(--border);
                word-break: break-all;
            }

            .decrypted-url a {
                color: var(--primary);
                text-decoration: none;
                font-weight: 600;
            }

            .decrypted-url a:hover {
                text-decoration: underline;
            }

            .btn-sm {
                padding: 8px 14px;
                font-size: 12px;
                border-radius: var(--radius-sm);
            }

            .btn-outline {
                background: transparent;
                border: 1.5px solid var(--border);
                color: var(--text);
                font-weight: 600;
            }

            .btn-outline:hover {
                border-color: var(--primary);
                color: var(--primary);
                background: var(--primary-light);
            }

            .btn-danger {
                background: var(--danger);
                color: #fff;
            }

            .btn-danger:hover {
                background: #dc2626;
            }

            .btn-warning {
                background: linear-gradient(135deg, #f59e0b, #ef4444);
                color: #fff;
                box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
            }

            .btn-warning:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            }

            .btn-success {
                background: var(--success);
                color: #fff;
            }

            .btn-success:hover {
                background: #059669;
            }

            /* ═══ EXAM STYLES ═══ */
            .exam-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 16px;
            }

            .exam-card {
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 20px;
                cursor: pointer;
                transition: var(--transition);
                position: relative;
            }

            .exam-card:hover {
                transform: translateY(-4px);
                border-color: var(--primary);
                box-shadow: var(--shadow-md);
            }

            .exam-card h4 {
                font-size: 15px;
                font-weight: 700;
                margin-bottom: 10px;
                line-height: 1.4;
            }

            .exam-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 12px;
            }

            .exam-tag {
                font-size: 11px;
                font-weight: 700;
                padding: 4px 10px;
                border-radius: 20px;
            }

            .exam-tag.paid {
                background: var(--danger-light);
                color: var(--danger);
            }

            .exam-tag.free {
                background: var(--success-light);
                color: var(--success);
            }

            .exam-tag.active {
                background: var(--info-light);
                color: var(--info);
            }

            .exam-tag.inactive {
                background: var(--bg);
                color: var(--text-muted);
            }

            .exam-detail {
                font-size: 13px;
                color: var(--text-muted);
                line-height: 1.7;
                font-weight: 500;
            }

            .exam-detail span {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                margin-right: 14px;
            }

            .exam-progress {
                margin-top: 14px;
            }

            .exam-progress-bar {
                height: 6px;
                background: var(--border-light);
                border-radius: 3px;
                overflow: hidden;
            }

            .exam-progress-fill {
                height: 100%;
                background: var(--success);
                border-radius: 3px;
                transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .exam-progress-text {
                font-size: 12px;
                color: var(--text-muted);
                margin-top: 6px;
                font-weight: 500;
            }

            /* Question page */
            .question-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 20px;
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-lg);
                margin-bottom: 20px;
                flex-wrap: wrap;
                gap: 12px;
                box-shadow: var(--shadow-sm);
            }

            .q-progress {
                font-size: 14px;
                font-weight: 700;
                color: var(--primary);
            }

            .q-timer {
                font-size: 14px;
                font-weight: 700;
                color: var(--text);
                font-family: 'JetBrains Mono', monospace;
                background: var(--bg);
                padding: 6px 14px;
                border-radius: var(--radius);
                border: 1px solid var(--border);
            }

            .q-timer.warning {
                background: var(--danger-light);
                color: var(--danger);
                border-color: var(--danger);
                animation: pulse 1s infinite;
            }

            @keyframes pulse {

                0%,
                100% {
                    opacity: 1;
                }

                50% {
                    opacity: 0.7;
                }
            }

            .question-card {
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 24px;
                margin-bottom: 20px;
                box-shadow: var(--shadow-sm);
            }

            .q-number {
                display: inline-flex;
                width: 36px;
                height: 36px;
                align-items: center;
                justify-content: center;
                background: var(--primary-gradient);
                color: #fff;
                border-radius: var(--radius);
                font-size: 14px;
                font-weight: 700;
                margin-bottom: 16px;
                box-shadow: var(--shadow-primary);
            }

            .q-text {
                font-size: 16px;
                font-weight: 500;
                line-height: 1.8;
                margin-bottom: 20px;
                white-space: pre-wrap;
                color: var(--text);
            }

            .q-text img {
                max-width: 100%;
                border-radius: var(--radius);
                margin-top: 10px;
            }

            .options-grid {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .option-item {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 14px 16px;
                background: var(--bg);
                border: 1.5px solid var(--border);
                border-radius: var(--radius);
                cursor: pointer;
                transition: var(--transition);
            }

            .option-item:hover {
                border-color: var(--primary);
                background: var(--primary-light);
            }

            .option-item.selected {
                border-color: var(--primary);
                background: var(--primary-light);
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            }

            .option-item.correct {
                border-color: var(--success);
                background: var(--success-light);
            }

            .option-item.wrong {
                border-color: var(--danger);
                background: var(--danger-light);
            }

            .option-radio {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 2.5px solid var(--border);
                flex-shrink: 0;
                margin-top: 2px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: var(--transition);
            }

            .option-item.selected .option-radio {
                border-color: var(--primary);
            }

            .option-item.selected .option-radio::after {
                content: "";
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--primary);
            }

            .option-item.correct .option-radio {
                border-color: var(--success);
            }

            .option-item.correct .option-radio::after {
                content: "";
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--success);
            }

            .option-item.wrong .option-radio {
                border-color: var(--danger);
            }

            .option-item.wrong .option-radio::after {
                content: "";
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--danger);
            }

            .option-text {
                font-size: 14px;
                line-height: 1.6;
                flex: 1;
                color: var(--text);
            }

            .option-text .skip-label {
                color: var(--text-muted);
                font-style: italic;
                font-size: 13px;
            }

            .question-nav {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 20px;
                padding-top: 20px;
                border-top: 1.5px solid var(--border-light);
            }

            .q-nav-btn {
                width: 40px;
                height: 40px;
                border-radius: var(--radius-sm);
                border: 1.5px solid var(--border);
                background: var(--surface);
                cursor: pointer;
                font-size: 13px;
                font-weight: 700;
                color: var(--text);
                transition: var(--transition);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .q-nav-btn:hover {
                border-color: var(--primary);
            }

            .q-nav-btn.active {
                background: var(--primary-gradient);
                color: #fff;
                border-color: var(--primary);
                box-shadow: var(--shadow-primary);
            }

            .q-nav-btn.answered {
                background: var(--success-light);
                color: var(--success);
                border-color: var(--success);
            }

            .q-nav-btn.skipped {
                background: var(--warning-light);
                color: var(--warning);
                border-color: var(--warning);
            }

            .question-actions {
                display: flex;
                gap: 12px;
                margin-top: 24px;
                flex-wrap: wrap;
            }

            .question-actions .btn {
                flex: 1;
                min-width: 120px;
            }

            /* Result styles */
            .result-card {
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: var(--radius-xl);
                padding: 32px;
                max-width: 520px;
                margin: 0 auto;
                text-align: center;
                box-shadow: var(--shadow-lg);
            }

            .result-score {
                font-size: 56px;
                font-weight: 800;
                background: var(--primary-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                line-height: 1;
            }

            .result-detail {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
                margin: 24px 0;
            }

            .result-item {
                background: var(--bg);
                border: 1px solid var(--border-light);
                border-radius: var(--radius);
                padding: 14px;
                transition: var(--transition);
            }

            .result-item:hover {
                border-color: var(--primary);
            }

            .result-item .rlabel {
                font-size: 10px;
                font-weight: 700;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .result-item .rvalue {
                font-size: 20px;
                font-weight: 800;
                margin-top: 6px;
            }

            .result-item .rvalue.green {
                color: var(--success);
            }

            .result-item .rvalue.red {
                color: var(--danger);
            }

            .result-item .rvalue.orange {
                color: var(--warning);
            }

            .result-rank {
                margin-top: 20px;
                font-size: 14px;
                color: var(--text-muted);
                font-weight: 500;
            }

            .btn-submit {
                background: var(--primary-gradient);
                color: #fff;
                padding: 14px 28px;
                font-size: 16px;
                font-weight: 700;
                border-radius: var(--radius-lg);
                width: 100%;
                box-shadow: var(--shadow-primary);
            }

            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 14px 40px -10px rgba(79, 70, 229, 0.5);
            }

            /* ═══ PROFILE PAGE ═══ */
            .profile-page {
                max-width: 600px;
                margin: 0 auto;
            }

            .profile-hero {
                text-align: center;
                margin-bottom: 32px;
                padding: 24px;
                background: var(--surface);
                border-radius: var(--radius-xl);
                border: 1.5px solid var(--border);
                box-shadow: var(--shadow-sm);
            }

            .profile-avatar {
                width: 88px;
                height: 88px;
                border-radius: 50%;
                background: var(--primary-gradient);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 32px;
                font-weight: 800;
                margin: 0 auto 16px;
                box-shadow: var(--shadow-primary);
            }

            .profile-hero h3 {
                font-size: 22px;
                font-weight: 700;
                margin-bottom: 4px;
            }

            .profile-hero p {
                color: var(--text-muted);
                font-size: 14px;
                font-weight: 500;
            }

            .profile-info-grid {
                background: var(--surface);
                border-radius: var(--radius-xl);
                border: 1.5px solid var(--border);
                overflow: hidden;
                box-shadow: var(--shadow-sm);
            }

            .profile-info-row {
                display: flex;
                justify-content: space-between;
                padding: 16px 20px;
                border-bottom: 1px solid var(--border-light);
                transition: var(--transition);
            }

            .profile-info-row:last-child {
                border-bottom: none;
            }

            .profile-info-row:hover {
                background: var(--bg);
            }

            .profile-info-row .label {
                color: var(--text-muted);
                font-size: 13px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .profile-info-row .value {
                font-weight: 600;
                font-size: 14px;
                color: var(--text);
            }

            /* ═══ EMPTY STATES ═══ */
            .empty-state {
                text-align: center;
                padding: 60px 20px;
            }

            .empty-state-icon {
                font-size: 64px;
                margin-bottom: 16px;
                opacity: 0.5;
            }

            .empty-state h3 {
                font-size: 18px;
                font-weight: 700;
                color: var(--text);
                margin-bottom: 8px;
            }

            .empty-state p {
                font-size: 14px;
                color: var(--text-muted);
                max-width: 400px;
                margin: 0 auto 20px;
                line-height: 1.6;
            }

            /* ═══ ANIMATIONS ═══ */
            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .animate-in {
                animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            }

            @media (max-width: 480px) {
                .auth-card {
                    padding: 24px;
                }

                .app-content {
                    padding: 16px;
                }

                .app-header {
                    padding: 12px 16px;
                }

                .app-nav {
                    padding: 10px 12px;
                }

                .exam-grid {
                    grid-template-columns: 1fr;
                }

                .result-detail {
                    grid-template-columns: 1fr;
                }

                .book-info {
                    grid-template-columns: 1fr;
                }
            }
    </style>
</head>

<body>

    <!-- LOADING -->
    <div id="app-loading">
        <div class="loader-brand">WS</div>
        <div class="loader-ring"></div>
        <p class="loader-text">Loading WebSankul Pro...</p>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- SCROLL TOP -->
    <button id="scroll-top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">↑</button>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">WS</div>
                <div class="logo-text">
                    <h2>WebSankul Pro</h2>
                    <p>Enterprise Learning Platform</p>
                </div>
            </div>
            <p class="sub">Secure login via OTP or Bearer Token. Your data is encrypted end-to-end.</p>
            <div class="auth-tabs">
                <button class="auth-tab active" data-panel="otp-panel" onclick="switchAuthPanel('otp-panel')">
                    📱 OTP Login
                </button>
                <button class="auth-tab" data-panel="token-panel" onclick="switchAuthPanel('token-panel')">
                    🔑 Token Login
                </button>
            </div>
            <div class="auth-panel active" id="otp-panel">
                <div id="step-phone">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone-input" placeholder="Enter 10-digit number" maxlength="10"
                            value="6355952589" />
                    </div>
                    <button class="btn btn-primary" id="send-otp-btn" onclick="sendOTP()">📨 Send OTP</button>
                </div>
                <div id="step-otp" style="display: none">
                    <p class="sub">OTP sent to <strong id="otp-phone-display">+91</strong></p>
                    <p style="text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Enter
                        4-digit verification code</p>
                    <div class="otp-inputs" id="otp-inputs">
                        <input type="text" maxlength="1" inputmode="numeric" oninput="otpMove(this, 0)" />
                        <input type="text" maxlength="1" inputmode="numeric" oninput="otpMove(this, 1)" />
                        <input type="text" maxlength="1" inputmode="numeric" oninput="otpMove(this, 2)" />
                        <input type="text" maxlength="1" inputmode="numeric" oninput="otpMove(this, 3)" />
                    </div>
                    <button class="btn btn-primary" id="verify-otp-btn" onclick="verifyOTP()">✅ Verify & Login</button>
                    <p style="text-align: center; margin-top: 14px">
                        <a href="#" onclick="resetOTP()"
                            style="color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none;">↩
                            Change Number</a>
                    </p>
                </div>
            </div>
            <div class="auth-panel" id="token-panel">
                <div class="form-group">
                    <label>Bearer Token</label>
                    <textarea id="token-input" placeholder="Paste your JWT Bearer Token here..."></textarea>
                </div>
                <div class="form-group">
                    <label>Device Info JSON (Optional)</label>
                    <textarea
                        id="device-info-input">{"platform":"application","osType":"android","deviceId":"SM-A156E","deviceBrand":"Samsung","deviceModal":"SM-A156E","version":"4.3.1.70","deviceUniqueId":"c0e6d63ffb93c13f"}</textarea>
                </div>
                <button class="btn btn-primary" style="width: 100%" onclick="loginWithToken()">🔓 Login with
                    Token</button>
            </div>
        </div>
    </div>

    <!-- APP SHELL -->
    <div id="app-shell">
        <header class="app-header">
            <div class="brand" onclick="showDashboard()">
                <div class="brand-icon">WS</div>
                <span>WebSankul Pro</span>
            </div>
            <button class="exit-btn" onclick="goToHome()">✖ Exit</button>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"
                title="Toggle Light/Dark Mode">🌙</button>
            <div class="user-info" onclick="toggleProfileDropdown()">
                <div class="avatar" id="user-avatar">U</div>
                <span class="name" id="user-name">User</span>
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="pd-header">
                        <div class="pd-avatar" id="pd-avatar">U</div>
                        <div>
                            <h4 id="pd-name">User</h4>
                            <p id="pd-phone">+91 ##########</p>
                        </div>
                    </div>
                    <div class="pd-divider"></div>
                    <button class="pd-item" onclick="showProfile()"><span class="pd-icon">👤</span> Profile</button>
                    <button class="pd-item" onclick="showDashboard()"><span class="pd-icon">🏠</span> Dashboard</button>
                    <button class="pd-item" onclick="fetchAllPackages()"><span class="pd-icon">📦</span> All
                        Packages</button>
                    <button class="pd-item" onclick="switchView('devmode')"><span class="pd-icon">🛠️</span> Developer
                        Setting</button>
                    <div class="pd-divider"></div>
                    <button class="pd-item danger" onclick="logout()"><span class="pd-icon">🚪</span> Logout</button>
                </div>
            </div>
        </header>

        <div class="app-nav" id="app-nav">
            <button class="app-nav-item active" data-view="dashboard" onclick="switchView('dashboard')"
                title="Dashboard">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Dashboard</span>
            </button>
            <button class="app-nav-item" data-view="packages" onclick="switchView('packages')" title="Packages">
                <span class="nav-icon">📦</span>
                <span class="nav-text">Packages</span>
            </button>
            <button class="app-nav-item" data-view="ebooks" onclick="switchView('ebooks')" title="EBooks">
                <span class="nav-icon">📘</span>
                <span class="nav-text">EBooks</span>
            </button>
        </div>

        <div class="app-content" id="app-content"></div>
    </div>

    <script>
        // === THEME SYSTEM ===
        const THEME_KEY = "ws_theme";
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            const isLight = body.classList.contains('light-theme');
            localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = isLight ? '☀️' : '🌙';
        }
        window.toggleTheme = toggleTheme;

        // Apply saved theme immediately
        (function () {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            window.addEventListener('DOMContentLoaded', () => {
                const btn = document.getElementById('themeToggle');
                if (btn) btn.textContent = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
            });
        })();

        // ─── STATE ───────────────────────────────────────────────────────────
        const STATE = {
            accessToken: null, user: null, details: null, deviceInfo: {},
            currentView: "dashboard", currentPackageId: null,
            currentSubjectId: null, currentSubjectTitle: "",
            dashboardData: null, packagesData: null, courseData: null,
            lecturesData: null, otpDetails: null,
            selectedFolderId: null, folderLectures: null,
            lastBookData: null, decryptedUrl: null,
            currentExamId: null, currentExamData: null,
            currentExamQuestions: null, examAnswers: {},
            examStartTime: null, examTimer: null, examResult: null,
            examSubjectId: null, examPackageId: null,
        };
        let bannerIdx = 0, bannerInterval;
        const BASE = "https://api.websankul.com/production/api/v1";
        const BASE2 = "https://api.websankul.com/production/api/v2";
        const EBOOK_URL = "https://api.websankul.com/production/api/v2/ebooks";

        // ─── NAVIGATION HISTORY STACK ───────────────────────────────────────
        STATE.viewStack = [];
        STATE.lastPackageSearch = "";
        STATE.lastEbookSearch = "";

        function pushViewStack(fn) {
            if (typeof fn === "function") {
                STATE.viewStack.push(fn);
            }
        }

        function goBackStack() {
            if (STATE.viewStack.length > 0) {
                const prevFn = STATE.viewStack.pop();
                prevFn();
            } else {
                showDashboard(true);
            }
        }

        function goToHome() { location.reload(); }
        function toast(msg, type = 'info') {
            const container = document.getElementById("toast-container");
            const t = document.createElement("div");
            t.className = "toast";
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            t.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span>${msg}`;
            container.appendChild(t);
            requestAnimationFrame(() => t.classList.add("show"));
            setTimeout(() => {
                t.classList.remove("show");
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }
        function hideLoading() {
            document.getElementById("app-loading").classList.add("hidden");
        }
        window.addEventListener("scroll", () => {
            document.getElementById("scroll-top").classList.toggle("show", window.scrollY > 400);
        });
        document.addEventListener("click", (e) => {
            const dd = document.getElementById("profile-dropdown");
            const ui = document.querySelector(".user-info");
