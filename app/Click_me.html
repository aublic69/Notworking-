<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Text</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .glow-text {
    color: #fff;
    font-family: 'Segoe UI', 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 10vw;
    text-align: center;
    padding: 0 20px;
    animation: flicker 2.5s infinite alternate;
  }

  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
      text-shadow:
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #0ff,
        0 0 80px #0ff,
        0 0 120px #0ff,
        0 0 160px #0ff;
      opacity: 1;
    }
    20%, 24%, 55% {
      text-shadow: none;
      opacity: 0.4;
    }
  }
</style>
</head>
<body>
  <div class="glow-text">🖕</div>
</body>
</html>
